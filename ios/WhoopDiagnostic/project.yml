name: WhoopDiagnostic
options:
  bundleIdPrefix: com.pulsewhoop
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WhoopDiagnostic:
    type: application
    platform: iOS
    sources:
      - path: WhoopDiagnostic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsewhoop.WhoopDiagnostic
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FLRJTH92XN
    info:
      path: WhoopDiagnostic/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Connects directly to your own WHOOP 5.0 strap over Bluetooth to read sensor data — no WHOOP account or subscription involved."
        NSHealthShareUsageDescription: "Reads health data as a secondary source alongside your WHOOP strap — WHOOP stays the primary source, HealthKit only fills gaps."
        NSHealthUpdateUsageDescription: "This app does not write to HealthKit; this description exists only because iOS requires it for any HealthKit entitlement."
        # Lets the app keep draining a historical BLE sync when backgrounded
        # (screen locked) instead of being suspended mid-sync — the cause of
        # a real data-loss incident: a 60,000+ record sync was silently
        # killed before it could save anything, because nothing was
        # persisted until the very end AND the app had no background BLE
        # capability declared. This is one of two fixes for that; the
        # other is checkpointed incremental saving in WhoopBLEManager.
        UIBackgroundModes:
          - bluetooth-central
    entitlements:
      path: WhoopDiagnostic/WhoopDiagnostic.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  WhoopDiagnosticTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhoopDiagnosticTests
    dependencies:
      - target: WhoopDiagnostic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsewhoop.WhoopDiagnosticTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
schemes:
  WhoopDiagnostic:
    build:
      targets:
        WhoopDiagnostic: all
    test:
      targets:
        - WhoopDiagnosticTests
    run:
      config: Debug
